---
all:
  hosts:
    localhost:
      ansible_connection: local
  children:
    # Docker VM (netuno) — the SSH alias `docker` is generated by homelab-iac
    # (~/.ssh/servers/homelab.conf), which carries user, IP and key.
    docker_hosts:
      hosts:
        docker:
          ansible_host: docker
          ansible_python_interpreter: /usr/bin/python3
