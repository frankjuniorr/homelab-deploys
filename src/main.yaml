---
##############################################
# Phase 1 workload layer — docker-compose stacks on the Docker VM (netuno)
# Requires the VM provisioned by homelab-iac (Docker Engine + /opt/stacks).
# Order matters: AdGuard (DNS) first — HAOS and Tailscale split-DNS depend on it.
##############################################
- name: "Deploy docker-compose stacks on the Docker VM"
  hosts: docker_hosts
  become: true
  gather_facts: false
  tags:
    - docker-stacks

  roles:
    - role: docker-stacks
      vars:
        stack_name: adguard
      tags: [docker-stacks, adguard]

    - role: docker-stacks
      vars:
        stack_name: tailscale
      tags: [docker-stacks, tailscale]

    - role: docker-stacks
      vars:
        stack_name: duplicati
      tags: [docker-stacks, duplicati]
